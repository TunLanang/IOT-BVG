<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermentation IoT Monitoring Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #007bff; color: white; padding: 15px; border-radius: 6px; text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; }
        .card p { font-size: 24px; font-weight: bold; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Fermentation Monitoring Dashboard</h1>
    
    <!-- Live Sensor Cards -->
    <div class="card-grid">
        <div class="card" style="background-color: #28a745;">
            <h3>pH Level</h3>
            <p id="live-ph">--</p>
        </div>
        <div class="card" style="background-color: #dc3545;">
            <h3>CO2 (PPM)</h3>
            <p id="live-co2">--</p>
        </div>
        <div class="card" style="background-color: #ffc107; color: #333;">
            <h3>Temperature</h3>
            <p id="live-temp">-- °C</p>
        </div>
        <div class="card" style="background-color: #17a2b8;">
            <h3>Wi-Fi RSSI</h3>
            <p id="live-rssi">-- dBm</p>
        </div>
    </div>

    <h2>Recent Sensor Logs</h2>
    <table>
        <thead>
            <tr>
                <th>Seq #</th>
                <th>Timestamp</th>
                <th>pH</th>
                <th>CO2 (PPM)</th>
                <th>Temp (°C)</th>
                <th>RSSI</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <!-- Data will be populated here dynamically -->
        </tbody>
    </table>
</div>

<!-- Firebase SDK Imports (Modular version) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // TODO: Replace with your project's configuration from Firebase Console
    const firebaseConfig = {
apiKey: "AIzaSyBMRp01LBFjz8YrWEadmQWQ_-WKLKLQyPM",

  authDomain: "iot-beverage-fermentation.firebaseapp.com",

  databaseURL: "https://iot-beverage-fermentation-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId: "iot-beverage-fermentation",

  storageBucket: "iot-beverage-fermentation.firebasestorage.app",

  messagingSenderId: "1091536049371",

  appId: "1:1091536049371:web:7836d9a4ec04dc1ee528fe",    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Reference to fermentation logs node
    const logsRef = query(ref(db, 'fermentation_logs'), limitToLast(10));

    // Listen for new data entries added to Firebase in real-time
    onChildAdded(logsRef, (snapshot) => {
        const val = snapshot.val();
        const data = val.data || val; // Handles nested or flat structures

        // Update live cards with the latest incoming record
        document.getElementById('live-ph').innerText = data.pH ?? '--';
        document.getElementById('live-co2').innerText = data.co2 ?? '--';
        document.getElementById('live-temp').innerText = (data.temperature ?? '--') + ' °C';
        document.getElementById('live-rssi').innerText = (data.rssi ?? '--') + ' dBm';

        // Append row to the history table
        const tableBody = document.getElementById('log-table-body');
        const row = `<tr>
            <td>${data.sequence_number ?? '--'}</td>
            <td>${new Date(data.timestamp).toLocaleTimeString() ?? '--'}</td>
            <td>${data.pH ?? '--'}</td>
            <td>${data.co2 ?? '--'}</td>
            <td>${data.temperature ?? '--'}</td>
            <td>${data.rssi ?? '--'}</td>
        </tr>`;
        tableBody.insertAdjacentHTML('afterbegin', row);
    });
</script>

</body>
</html>
